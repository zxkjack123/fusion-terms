name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov mypy

      - name: Run tests
        run: pytest --cov=pipeline --cov-fail-under=30

      - name: Mypy type check
        run: mypy pipeline/ --ignore-missing-imports --no-error-summary || true

      - name: Ruff lint (minimal gate)
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check . || true

      - name: Compile check
        run: python -m compileall -q pipeline tests

      - name: Validate registry
        run: python3 -m pipeline.validate_registry
