# fusion-terms configuration

[sources]
# Your Markdown corpus root (pdf2md output). Can be overridden by CLI flags.
# For a real corpus, change this to your pdf2md output directory.
# The default points to a tiny fixture corpus so the pipeline can run out-of-the-box.
root = "tests/fixtures/corpus"

# Exclude derived/noise markdown files produced by pdf2md stages.
# These frequently duplicate content and introduce LaTeX/QA artifacts.
exclude_globs = [
	"*.qa_report.md",
	"*.actionable_report.md",
	"*.autofix.md",
	"*_debug.md",
]

[extract]
# Chinese candidate span length bounds
min_zh_len = 2
max_zh_len = 8

# How many example contexts to store per term
max_examples = 3

# Cap per-term file list to avoid huge TSVs
max_files_per_term = 20

[artifacts]
out_dir = "artifacts"

[export]
# Minimum length for ASCII English keys kept in translation_dict.en2zh.
# Shorter keys are moved to translation_dict.en2zh_short for contextual handling.
min_en_key_len = 3

[rime]
dict_name = "rime_ice"
backup_paths = [
	"~/.local/share/fcitx5/rime",
	"~/.config/fcitx5/rime",
]
sync_dest = "~/.config/fcitx/rime/wordlists/domain_terms.txt"
import_script = "~/.local/bin/rime_import_wordlist.py"
